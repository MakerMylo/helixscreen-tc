name: Release

# Fork release: Raspberry Pi 64-bit only.
#
# Upstream's workflow builds eight platforms plus signed Android APKs and
# publishes through a CDN; this fork needs none of that. A `v*` tag builds the
# Pi package the same way upstream's Pi job does (Docker cross-toolchain, DRM
# and fbdev variants, pre-rendered images, `make release-pi`) and publishes it
# as a full GitHub release, which is what the bundled installer, Moonraker's
# `[update_manager helixscreen]` (type: web) and the in-app updater all read.
#
# Every release is published as a FULL release, never a prerelease, whatever
# the version string says: `releases/latest` (which all three consumers use)
# skips prereleases, and this fork has no channels to route.
#
# Two ways to cut one: push a `v*` tag, or press "Run workflow" on the Actions
# tab (workflow_dispatch), which releases the chosen branch's VERSION.txt and
# creates the tag itself. The second needs no local git at all.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HELIX_PATCHES_FROM_CLEAN: "1"

jobs:
  build-pi:
    name: Build (Raspberry Pi)
    runs-on: ubuntu-22.04
    # Upstream measures a cold pi-both build at ~115-125 min on these runners.
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Resolve the version
      id: version
      run: |
        set -eu
        FILE_VERSION="$(tr -d '[:space:]' < VERSION.txt)"
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION.txt (${FILE_VERSION}). Update VERSION.txt, commit, then tag that commit."
            exit 1
          fi
        else
          # Run workflow: release what VERSION.txt says, refusing to reuse a
          # version that already has a tag.
          VERSION="$FILE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::v${VERSION} is already released. Bump VERSION.txt and commit first."
            exit 1
          fi
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Check the bundled installer is current
      run: |
        bash scripts/bundle-installer.sh -o /tmp/install-regen.sh
        if ! diff -q scripts/install.sh /tmp/install-regen.sh >/dev/null; then
          echo "::error::scripts/install.sh is stale — run: bash scripts/bundle-installer.sh -o scripts/install.sh"
          exit 1
        fi

    - name: Free up disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Add swap for the link peak
      run: |
        sudo fallocate -l 16G /swapfile-helix || sudo dd if=/dev/zero of=/swapfile-helix bs=1M count=16384
        sudo chmod 600 /swapfile-helix
        sudo mkswap /swapfile-helix
        sudo swapon /swapfile-helix
        free -h

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: /tmp/.ccache-pi
        key: ccache-fork-pi-${{ github.sha }}
        restore-keys: |
          ccache-fork-pi-

    - name: Configure ccache
      run: |
        mkdir -p /tmp/.ccache-pi
        printf 'max_size = 2G\ncompression = true\n' > /tmp/.ccache-pi/ccache.conf

    - name: Build Pi toolchain image
      run: |
        docker buildx build \
          --cache-from type=gha,scope=toolchain-pi \
          --cache-to type=gha,mode=max,scope=toolchain-pi \
          --load \
          -t helixscreen/toolchain-pi \
          -f docker/Dockerfile.pi \
          docker/

    - name: Cross-compile for Raspberry Pi (DRM + fbdev)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/src \
          -v /tmp/.ccache-pi:/root/.cache/ccache \
          -e CCACHE_DIR=/root/.cache/ccache \
          -e HELIX_PATCHES_FROM_CLEAN \
          -w /src \
          helixscreen/toolchain-pi \
          make PLATFORM_TARGET=pi-both HELIX_PACKAGING=1 SKIP_OPTIONAL_DEPS=1 -j$(nproc)

    - name: Fix build directory ownership
      run: sudo chown -R $(id -u):$(id -g) build/

    # Saved on a tag ref, so only readable by later tags through the
    # restore-keys prefix on the default branch scope... which tags cannot see.
    # Kept anyway: cheap, and a scheduled warm on main is not worth its own
    # workflow on a fork.
    - name: Save ccache
      uses: actions/cache/save@v5
      if: always()
      with:
        path: /tmp/.ccache-pi
        key: ccache-fork-pi-${{ github.sha }}

    - name: Generate pre-rendered images
      run: make venv-setup && make gen-all-images

    - name: Package Pi release
      run: make release-pi

    - name: Prepare release files
      run: |
        set -eu
        mkdir -p release-files
        cp releases/helixscreen-pi-*.tar.gz releases/helixscreen-pi.zip release-files/
        # The bundled installer, so `curl .../releases/latest/download/install.sh | sh` works.
        cp scripts/install.sh release-files/
        ls -lh release-files/

    - name: Write release notes
      run: |
        set -eu
        TAG_MESSAGE=""
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null | head -500)
        fi
        if [ -n "$TAG_MESSAGE" ]; then
          printf '%s\n' "$TAG_MESSAGE" > release-notes.md
        else
          cat > release-notes.md <<EOF
        ## HelixScreen ${{ steps.version.outputs.version }} (MakerMylo fork)

        Raspberry Pi 64-bit build of this fork. See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}).

        ### Install or update on the Pi
        \`\`\`bash
        curl -sSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh -s -- --update
        \`\`\`
        EOF
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.version.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          release-files/*.tar.gz
          release-files/*.zip
          release-files/install.sh
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
